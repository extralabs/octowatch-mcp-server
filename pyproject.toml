[project]
name = "octowatch-mcp"
version = "0.3.0"
description = "Read-only MCP server for OctoWatch DLP Cloud (console analytics, monitoring, risks, productivity)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "KOLIBRI LLC" }]
keywords = ["mcp", "octowatch", "dlp", "employee-monitoring"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "mcp[cli]>=2.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
octowatch-mcp = "octowatch_mcp.server:main"

[project.urls]
Homepage = "https://octowatchdlp.com"
Documentation = "https://octowatchdlp.com/docs/"
API = "https://app.octowatchdlp.com/api/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octowatch_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]
