[project]
name = "octowatch-mcp"
version = "0.5.1"
description = "Read-only MCP server for OctoWatch DLP Cloud (octowatchdlp.com) - risks, idle time, productivity, and employee monitoring for Cursor, Claude, and VS Code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "KOLIBRI LLC" }]
keywords = [
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "octowatch",
  "octowatch-dlp",
  "octowatchdlp",
  "dlp",
  "employee-monitoring",
  "productivity",
  "security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "mcp[cli]>=2.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
octowatch-mcp = "octowatch_mcp.server:main"

[project.urls]
Homepage = "https://octowatchdlp.com/"
Documentation = "https://octowatchdlp.com/docs/"
Console = "https://app.octowatchdlp.com/"
API = "https://app.octowatchdlp.com/api/"
Repository = "https://github.com/extralabs/octowatch-mcp-server"
Issues = "https://github.com/extralabs/octowatch-mcp-server/issues"
Changelog = "https://github.com/extralabs/octowatch-mcp-server/blob/main/CHANGELOG.md"
"MCP Registry" = "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.extralabs/octowatch-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octowatch_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]
